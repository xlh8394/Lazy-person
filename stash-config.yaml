# ============================================================
# TUN
# ============================================================

tun:
  enable: true

  stack: system

  auto-route: true
  auto-detect-interface: true

  strict-route: true

  auto-redirect: true

  dns-hijack:
    - any:53
    - tcp://any:53


# ============================================================
# NTP
# ============================================================

ntp:
  enable: true
  server: ntp.aliyun.com
  port: 123
  interval: 60
