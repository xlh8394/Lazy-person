# ============================================================
# Stash Windows - 优化完整配置
# 基于 AIsouler / MyClash mihomoScript.js 逻辑整理
# ============================================================

mode: rule
log-level: info

allow-lan: false
bind-address: "*"

ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict

mixed-port: 7890

external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

profile:
  store-selected: true
  store-fake-ip: true

# ============================================================
# DNS
# ============================================================

dns:
  enable: true

  ipv6: true

  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48

  use-hosts: true
  use-system-hosts: true

  cache-algorithm: arc

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  nameserver:
    - https://cloudflare-dns.com/dns-query#默认代理
    - https://dns.google/dns-query#默认代理

  nameserver-policy:
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

  direct-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - "*.mcdn.bilivideo.cn"

    # 原脚本规则
    - "rule-set:private"
    - "rule-set:fakeip_filter"
    - "rule-set:geolocation-cn"

  skip-cert-verify: false


# ============================================================
# Hosts
# ============================================================

hosts:

  cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1

  dns.google:
    - 8.8.8.8
    - 8.8.4.4

  services.googleapis.cn:
    - services.googleapis.com


# ============================================================
# 远程订阅
# ============================================================

proxy-providers:

  subscription:
    url: "你的订阅连接"

    interval: 3600

    path: ./providers/subscription.yaml

    health-check:
      enable: true
      interval: 600
      url: https://www.apple.com/library/test/success.html


# ============================================================
# 代理组
# ============================================================

proxy-groups:

  # ----------------------------------------------------------
  # 1. 手动选择
  # ----------------------------------------------------------

  - name: 手动选择
    type: select

    proxies:
      - 自动选择
      - 负载均衡

      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其它节点

      - DIRECT


  # ----------------------------------------------------------
  # 2. 自动选择
  # ----------------------------------------------------------

  - name: 自动选择
    type: url-test

    include-all: true

    filter: '^(?!.*(?:官网|公告|通知|套餐|剩余|流量|到期|续费|客服|群|频道|订阅|返利|循环|网站|网址|获取|机场|备用|过期|已用|联系|邮箱|工单|国内|电报|超时|优惠|福利|邀请|失联|公益|发布|通路|登录|禁止|定时|渠道|余额|本站|刷新|导航|建议|重置|过滤|⚠️|@|t\.me|\.com|traffic)).*$'

    url: https://www.apple.com/library/test/success.html

    interval: 600
    tolerance: 50

    lazy: true

    timeout: 3000

    max-failed-times: 3

    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  # ----------------------------------------------------------
  # 3. 负载均衡
  # ----------------------------------------------------------

  - name: 负载均衡
    type: load-balance

    include-all: true

    filter: '^(?!.*(?:官网|公告|通知|套餐|剩余|流量|到期|续费|客服|群|频道|订阅|返利|循环|网站|网址|获取|机场|备用|过期|已用|联系|邮箱|工单|国内|电报|超时|优惠|福利|邀请|失联|公益|发布|通路|登录|禁止|定时|渠道|余额|本站|刷新|导航|建议|重置|过滤|⚠️|@|t\.me|\.com|traffic)).*$'

    strategy: consistent-hashing

    url: https://www.apple.com/library/test/success.html

    interval: 600

    lazy: true

    timeout: 3000

    max-failed-times: 3

    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin.png


  # ==========================================================
