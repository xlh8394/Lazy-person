# ============================================================
# Stash PC / Windows 配置
# 基于 mihomoScript.js (AIsouler / Lazy-person) 逻辑优化
# 适配 Stash Windows
# ============================================================


# ============================================================
# 基础设置
# ============================================================

mode: rule
log-level: info
allow-lan: false


# ============================================================
# DNS
# ============================================================

dns:
  enable: true

  # 用于解析代理服务器、Provider、规则等
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system

  # 国外 DNS
  # 通过“默认代理”访问
  nameserver:
    - https://cloudflare-dns.com/dns-query#默认代理
    - https://dns.google/dns-query#默认代理

  # 中国大陆域名使用国内 DNS
  nameserver-policy:
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29

  # Fake-IP 排除
  fake-ip-filter:
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - 'lens.l.google.com'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - '*.mcdn.bilivideo.cn'

  skip-cert-verify: false


# ============================================================
# 代理提供者
# ============================================================

proxy-providers:

  subscription:
    url: "你的订阅连接"
    interval: 3600
    path: ./providers/subscription.yaml

    health-check:
      enable: true
      interval: 600
      url: https://www.apple.com/library/test/success.html


