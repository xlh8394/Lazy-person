mode: rule
log-level: info
allow-lan: false
bind-address: "*"

mixed-port: 7890

ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict

external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/dist.zip

profile:
  store-selected: true
  store-fake-ip: true

ntp:
  enable: true
  server: ntp.aliyun.com
  port: 123
  interval: 60

dns:
  enable: true
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT

  nameserver:
    - https://cloudflare-dns.com/dns-query#默认代理
    - https://dns.google/dns-query#默认代理

  nameserver-policy:
    "rule-set:cn":
      - 223.5.5.5
      - 119.29.29.29

  direct-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - "*.mcdn.bilivideo.cn"

hosts:
  "cloudflare-dns.com":
    - 1.1.1.1
    - 1.0.0.1
  "dns.google":
    - 8.8.8.8
    - 8.8.4.4
  "services.googleapis.cn":
    - services.googleapis.com

tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

proxy-providers:

  机场1:
    url: "YOUR_SECOND_AIRPORT_SUBSCRIPTION_URL"
    type: http
    interval: 3600
    path: ./providers/机场1.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.apple.com/library/test/success.html

  机场2:
    url: "YOUR_SECOND_AIRPORT_SUBSCRIPTION_URL"
    type: http
    interval: 3600
    path: ./providers/机场2.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.apple.com/library/test/success.html

proxy-groups:

  - name: 手动选择
    type: select
    include-all: true

  - name: 自动选择
    type: url-test
    include-all: true
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 负载均衡
    type: load-balance
    strategy: consistent-hashing
    include-all: true
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    lazy: true

  - name: FCM
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择
      - DIRECT

  - name: YouTube
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Google
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: AI
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Microsoft
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择
      - DIRECT

  - name: Apple
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择
      - DIRECT

  - name: Telegram
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Steam
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: TikTok
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Twitter
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Instagram
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Netflix
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Emby
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: PikPak
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Spotify
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: Crypto
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: EHentai
    type: select
    proxies:
      - 默认代理
      - 自动选择
      - 手动选择

  - name: 默认代理
    type: select
    proxies:
      - 自动选择
      - 负载均衡
      - 手动选择
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 低倍率节点
      - 高倍率节点
      - 其它节点

  - name: 低倍率节点
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:0\.[0-9]+|免费|free|低倍率|低倍)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 高倍率节点
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:x2|x3|x4|x5|x6|x7|x8|x9|2倍|3倍|4倍|5倍|高倍率|高倍)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 🇭🇰 香港
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:🇭🇰|香港|HKG|Hong\s*Kong)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 🇹🇼 台湾
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:🇹🇼|台湾|台北|高雄|TWN|Taiwan)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 🇯🇵 日本
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:🇯🇵|日本|东京|大阪|京都|JPN|Japan)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 🇸🇬 新加坡
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:🇸🇬|新加坡|狮城|SGP|Singapore)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 🇺🇸 美国
    type: url-test
    include-all: true
    filter: '(?i)^(?=.*(?:🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|USA|America|United\s*States)).*$'
    exclude-type: direct
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true

  - name: 其它节点
    type: select
    include-all: true
    exclude-type: direct
    filter: '(?i)^(?!.*(?:🇭🇰|香港|HKG|Hong\s*Kong|🇹🇼|台湾|台北|高雄|TWN|Taiwan|🇯🇵|日本|东京|大阪|京都|JPN|Japan|🇸🇬|新加坡|狮城|SGP|Singapore|🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|USA|America|United\s*States|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|备用|过期|已用|联系|邮箱|工单|通知|国内|频道|电报|超时|优惠|福利|邀请|失联|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|余额|本站|刷新|导航|建议|重置|过滤|⚠️|@|t\.me|\.com|traffic)).*$'

