# ============================================================
# 策略组
# ============================================================

proxy-groups:

  # ==========================================================
  # 地区节点
  # ==========================================================

  # ----------------------------------------------------------
  # 🇭🇰 香港
  # ----------------------------------------------------------

  - name: 🇭🇰 香港
    type: select
    include-all: true
    filter: '^(?=.*(?:🇭🇰|香港|HKG|Hong\s*Kong)).*$'
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png


  - name: 🇭🇰 香港-自动选择
    type: url-test
    include-all: true
    filter: '^(?=.*(?:🇭🇰|香港|HKG|Hong\s*Kong)).*$'
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  # ----------------------------------------------------------
  # 🇹🇼 台湾
  # ----------------------------------------------------------

  - name: 🇹🇼 台湾
    type: select
    include-all: true
    filter: '^(?=.*(?:🇹🇼|台湾|台北|高雄|TWN|Taiwan)).*$'
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png


  - name: 🇹🇼 台湾-自动选择
    type: url-test
    include-all: true
    filter: '^(?=.*(?:🇹🇼|台湾|台北|高雄|TWN|Taiwan)).*$'
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  # ----------------------------------------------------------
  # 🇯🇵 日本
  # ----------------------------------------------------------

  - name: 🇯🇵 日本
    type: select
    include-all: true
    filter: '^(?=.*(?:🇯🇵|日本|东京|大阪|京都|JPN|Japan)).*$'
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png


  - name: 🇯🇵 日本-自动选择
    type: url-test
    include-all: true
    filter: '^(?=.*(?:🇯🇵|日本|东京|大阪|京都|JPN|Japan)).*$'
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  # ----------------------------------------------------------
  # 🇸🇬 新加坡
  # ----------------------------------------------------------

  - name: 🇸🇬 新加坡
    type: select
    include-all: true
    filter: '^(?=.*(?:🇸🇬|新加坡|狮城|SGP|Singapore)).*$'
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png


  - name: 🇸🇬 新加坡-自动选择
    type: url-test
    include-all: true
    filter: '^(?=.*(?:🇸🇬|新加坡|狮城|SGP|Singapore)).*$'
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  # ----------------------------------------------------------
  # 🇺🇸 美国
  # ----------------------------------------------------------

  - name: 🇺🇸 美国
    type: select
    include-all: true
    filter: '^(?=.*(?:🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|USA|America|United\s*States)).*$'
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png


  - name: 🇺🇸 美国-自动选择
    type: url-test
    include-all: true
    filter: '^(?=.*(?:🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|USA|America|United\s*States)).*$'
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  # ----------------------------------------------------------
  # 其它节点
  # ----------------------------------------------------------

  - name: 其它节点
    type: select
    include-all: true
    filter: '^(?!.*(?:🇭🇰|香港|HKG|Hong\s*Kong|🇹🇼|台湾|台北|高雄|TWN|Taiwan|🇯🇵|日本|东京|大阪|京都|JPN|Japan|🇸🇬|新加坡|狮城|SGP|Singapore|🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|USA|America|United\s*States)).*$'


  # ==========================================================
  # 核心策略
  # ==========================================================

  - name: 手动选择
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其它节点
      - 自动选择
      - 负载均衡
      - DIRECT
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png


  - name: 自动选择
    type: url-test
    include-all: true
    filter: '^(?!.*(?:官网|公告|通知|套餐|剩余|流量|到期|续费|客服|群|频道|订阅)).*$'
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png


  - name: 负载均衡
    type: load-balance
    include-all: true
    filter: '^(?!.*(?:官网|公告|通知|套餐|剩余|流量|到期|续费|客服|群|频道|订阅)).*$'
    strategy: consistent-hashing
    url: https://www.apple.com/library/test/success.html
    interval: 600
    lazy: true
    timeout: 3000
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin.png


  # ==========================================================
  # 服务策略组
  # ==========================================================

  - name: FCM
    type: select
    proxies:
      - 默认代理
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 自动选择
      - DIRECT
    icon: https://fastly.jsdelivr.net/gh/MiToverG422/Qure@master/IconSet/Color/fcm.png


  - name: YouTube
    type: select
    proxies:
      - 默认代理
