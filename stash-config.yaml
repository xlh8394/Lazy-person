# ============================================================
# Stash PC (Windows) 配置
# 基于 mihomoScript.js (AIsouler/Lazy-person) 逻辑优化
# 适配 Stash 官方配置规范
# ============================================================

mode: rule
log-level: info

# Windows 后台服务推荐关闭 allow-lan（如需局域网共享可改为 true）
allow-lan: false

# DNS 配置（按 Stash 官方推荐优化）
dns:
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29
  fake-ip-filter:
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - 'lens.l.google.com'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - '*.mcdn.bilivideo.cn'
  skip-cert-verify: true

# ============================================================
# 代理提供者（请替换成你自己的机场订阅）
# ============================================================
proxy-providers:
  # 示例：把下面 url 换成你的订阅链接
   subscription:
     type: http
     url: "https://your-airport-subscribe-url"
     interval: 3600
     path: ./providers/subscription.yaml
     health-check:
       enable: true
       interval: 600
       url: https://www.apple.com/library/test/success.html

