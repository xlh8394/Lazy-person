# ============================================================
# Stash PC / Windows 配置
# 基于 mihomoScript.js (AIsouler / Lazy-person) 逻辑优化
# 适配 Stash Windows
# ============================================================

mode: rule
log-level: info

# ============================================================
# 基础设置
# ============================================================

allow-lan: false

# ============================================================
# DNS
# ============================================================

dns:
  enable: true

  # 默认 DNS：用于解析代理服务器、规则等
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - system

  # 默认远程 DNS
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 中国大陆域名优先使用国内 DNS
  nameserver-policy:
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29

  # Fake-IP 排除
  fake-ip-filter:
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - 'lens.l.google.com'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - '*.mcdn.bilivideo.cn'

  # 如果 DoH 在你的 Windows 环境下正常工作，
  # 建议保持 false；只有出现证书/TLS 问题时再改为 true
  skip-cert-verify: false


# ============================================================
# 代理提供者
# ============================================================

proxy-providers:

  subscription:
    url: "https://your-airport-subscribe-url"
    interval: 3600
    path: ./providers/subscription.yaml

    health-check:
      enable: true
      interval: 600
      url: https://www.apple.com/library/test/success.html


