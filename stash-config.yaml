# ============================================================
# 策略组（对应原脚本 baseGroups + serviceConfigs）
# ============================================================
proxy-groups:
  # 基础策略组
  - name: 手动选择
    type: select
    proxies:
      - 自动选择
      - 负载均衡
      - DIRECT
      # 下面会自动包含订阅节点（通过 include-all 或手动添加）
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png

  - name: 自动选择
    type: url-test
    url: https://www.apple.com/library/test/success.html
    interval: 600
    tolerance: 50
    lazy: true
    proxies: []          # 请在 Stash 中勾选「包含所有代理」或手动填入
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png

  - name: 负载均衡
    type: load-balance
    strategy: sticky-sessions
    url: https://www.apple.com/library/test/success.html
    interval: 600
    proxies: []
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin.png

  # 服务分流组（默认指向手动选择，可自行改）
