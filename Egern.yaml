# ============================================================
# 配置名称: Egern 配置 (整理优化版)
# 配置作者:
# 更新时间: 26-08-17 00:00
# ============================================================

# ---------------- 基础网络设置 ----------------
http_port: 6152
socks_port: 6153
vif_only: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204

# ---------------- DNS 设置 ----------------
dns:
  bootstrap:
  - system
  upstreams:
    Domestic-DNS:
    - 223.5.5.5
    - 119.29.29.29
    Domestic-Encrypted-DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  forward:
  # 先拦截广告域名解析
  - proxy_rule_set:
      match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Reject.yaml
      value: REJECT
      disabled: false
  # 国内域名走国内 DNS
  - proxy_rule_set:
      match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/ChinaDomain.yaml
      value: Domestic-DNS
      disabled: false
  # 其余全部走国内加密 DNS（兜底）
  - domain_wildcard:
      match: '*'
      value: Domestic-Encrypted-DNS
      disabled: false
  hosts:
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
    cloudflare-dns.com:
    - 104.16.249.249
    - 104.16.248.249
    - 2606:4700::6810:f8f9
    - 2606:4700::6810:f9f9
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    - 2400:3200:baba::1
    - 2400:3200::1
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    dot.pub:
    - 1.12.12.12
    - 120.53.53.53
  proxy_nameservers:
  - 119.29.29.29
  - 223.5.5.5

# ---------------- 真实 IP 直连域名（不走代理解析）----------------
# 游戏主机 / 联机服务 / 特定 CDN，避免因走代理解析导致连不上
real_ip_domains:
- lancache.steamcontent.com
- '*.msftconnecttest.com'
- '*.msftncsi.com'
- '*.srv.nintendo.net'
- '*.stun.playstation.net'
- xbox.*.microsoft.com
- '*.xboxlive.com'
- '*.logon.battlenet.com.cn'
- '*.logon.battle.net'
- stun.l.google.com
- easy-login.10099.com.cn
- '*-update.xoyocdn.com'
- '*.prod.cloud.netflix.com'
- appboot.netflix.com
- '*-appboot.netflix.com'

# ============================================================
# 策略组 (policy_groups)
# ============================================================
policy_groups:

# ---- 订阅节点入口 ----
- external:
    name: Manual  # 订阅节点选择组，手动指定使用哪个节点
    type: select
    urls:
    - Your subscription
    filter: '^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量).)+$'
    update_interval: 86400
    icon: https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png
    hidden: false

# ---- 分类策略组 ----
- select:
    name: Apple  # Apple 官方服务（App Store、iCloud 等）
    policies:
    - DIRECT
    - REJECT
    - Manual
    - Auto
    - HongKong
    - Taiwan
    - Japan
    - Korea
    - Singapore
    - UnitedStates
    flatten: false
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_2.png
    hidden: false
- select:
    name: AI  # AI 服务（ChatGPT、Claude、Gemini 等）
    policies:
    - Manual
    - Auto
    - DIRECT
    - REJECT
    - HongKong
    - Taiwan
    - Japan
    - Korea
    - Singapore
    - UnitedStates
    flatten: false
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
    hidden: false
- select:
