    hidden: true

# ============================================================
# 分流规则 (rules) —— 按命中优先级从上到下匹配
# ============================================================
rules:
# 1. 规则修正：确保部分域名不被误拦截，优先直连
- rule_set:
    name: 规则修正  # 修正部分域名的误判/误拦截，强制直连
    match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/Unbreak.yaml
    policy: DIRECT
    update_interval: 86400
    disabled: false
# 2. 广告拦截
- rule_set:
    name: AdBlock  # 广告域名拦截
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list
    policy: REJECT
    update_interval: 86400
    disabled: false
# 3. 按 App/平台分流
- rule_set:
    name: AI  # AI 服务域名匹配（ChatGPT、Claude、Gemini 等），命中后走 AI 策略组
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/AI.yaml
    policy: AI
    update_interval: 86400
    disabled: false
- rule_set:
    name: GoogleVoice  # Google Voice 直接指定走美国节点，不使用单独策略组
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/GoogleVoice/GoogleVoice.list
    policy: UnitedStates
    update_interval: 86400
    disabled: false
- rule_set:
    name: Spotify  # Spotify 域名匹配，命中后走 Spotify 策略组
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list
    policy: Spotify
    update_interval: 86400
    disabled: false
- rule_set:
    name: TikTok  # TikTok 域名匹配，命中后走 TikTok 策略组
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TikTok/TikTok.list
    policy: TikTok
    update_interval: 86400
    disabled: false
- rule_set:
    name: Emby  # Emby 域名匹配，命中后走 Emby 策略组
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Emby/Emby.list
    policy: Emby
    update_interval: 86400
    disabled: false
- rule_set:
    name: BiliBili  # 哔哩哔哩域名匹配，命中后走 BiliBili 策略组
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/BiliBili/BiliBili.list
    policy: BiliBili
    update_interval: 86400
    disabled: false
- rule_set:
    name: ChinaMedia  # 国内流媒体域名匹配
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMedia/ChinaMedia.list
    policy: ChinaMedia
    update_interval: 86400
    disabled: false
- rule_set:
    name: GlobalMedia  # 国外流媒体域名匹配
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GlobalMedia/GlobalMedia.list
    policy: GlobalMedia
    update_interval: 86400
    disabled: false
- rule_set:
    name: GlobalSites  # 常见需代理访问的国外网站合集
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list
    policy: GlobalSites
    update_interval: 86400
    disabled: false
- rule_set:
    name: Apple  # Apple 服务域名匹配
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list
    policy: Apple
    update_interval: 86400
    disabled: false
# 4. 局域网 / 国内网站直连
- rule_set:
    name: LAN  # 局域网地址直连
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list
    policy: DIRECT
    update_interval: 86400
    disabled: false
- rule_set:
    name: ChinaSites  # 国内网站域名直连
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list
    policy: DIRECT
    update_interval: 86400
    disabled: false
# 5. GeoIP 兜底：国内 IP 直连，非国内走全球网站策略组
- geoip:
    match: CN
    policy: DIRECT
- not:
    match:
      geoip:
        match: CN
    policy: GlobalSites
# 6. 最终兜底
- default:
    name: Final  # 兜底规则，未命中以上任何规则的流量走这里
    policy: Final

# ============================================================
# MITM（中间人解密，仅用于 Script-Hub / Sub-Store 等脚本管理）
# ============================================================
mitm:
  ca_p12: egern.p12
  ca_passphrase: egern
  hostnames:
    includes:
    - raw.githubusercontent.com
    - gist.githubusercontent.com
    - github.com

