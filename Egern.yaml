dns:
  bootstrap:
  - 233.5.5.5
  - 119.29.29.29
  upstreams:
    EncryptedDNS:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  forward:
  - domain_wildcard:
      match: '*'
      value: EncryptedDNS
      disabled: false
  public_ip_lookup_url: https://ifconfig.me/ip
