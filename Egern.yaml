# ---- 自动测速 ----
- auto_test:
    name: Auto  # 自动测速，从订阅节点中选延迟最低的
    policies:
    - Manual
    flatten: true
    filter: ^
    interval: 1800
    tolerance: 50
    timeout: 5
    icon: https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Roundrobin.png
    hidden: false

# ---- 按地区筛选的智能节点组（隐藏，供上方策略组调用）----
- smart:
    name: HongKong  # 自动筛选香港节点
    policies:
    - Manual
    flatten: true
    filter: 香港|港|HK|🇭🇰|(?i)Hong
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/HK.png
    hidden: true
- smart:
    name: Taiwan  # 自动筛选台湾节点
    policies:
    - Manual
    flatten: true
    filter: 台湾|台|TW|🇹🇼|(?i)Taiwan
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TW.png
    hidden: true
- smart:
    name: Japan  # 自动筛选日本节点
    policies:
    - Manual
    flatten: true
    filter: 日本|日|JP|🇯🇵|(?i)Japan
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/JP.png
    hidden: true
- smart:
    name: Korea  # 自动筛选韩国节点
    policies:
    - Manual
    flatten: true
    filter: 韩国|韩|KR|🇰🇷|(?i)Korea
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/KR.png
    hidden: true
- smart:
    name: Singapore  # 自动筛选新加坡节点
    policies:
    - Manual
