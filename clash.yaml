# 配置名称: Clash 配置（Mihomo 内核优化版 · 适配 Sparkle 客户端）
# 配置作者:Claude 二次优化
# 更新时间: 2026-08-15
#
# 本次优化要点（详见对应位置注释）：
# 1. geodata 数据库改用 .mrs 二进制格式，加载更快、内存占用更低
# 2. DNS 增加 respect-rules / proxy-server-nameserver / direct-nameserver，
#    彻底避免"通过代理节点解析节点自身域名"导致的握手失败或 DNS 泄漏
# 3. fake-ip-filter 补充常见内网/NTP 域名，减少不必要的 fake-ip 分配
# 4. sniffer 增加 skip-domain，避免个别应用（如某些 QUIC/游戏）被嗅探误判
# 5. 端口/TUN/嗅探这几项 Sparkle 默认会用 GUI 设置覆写本文件，
#    如果你是"裸核"运行（不通过 Sparkle 界面接管），才需要这部分手动配置
# [端口设置]
# 注意：Sparkle 在 GUI 中开启"接管"后会自动覆写这些端口，
# 如果你在 Sparkle 设置里已经配置了端口，这里可以不用管，留空即可以免冲突
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894

# [通用设置]
external-controller: 0.0.0.0:9090
geodata-loader: memconservative       # 内存节省模式；如设备内存充足(>=2G)可改为 standard 提升加载/匹配速度
unified-delay: true
allow-lan: true
ipv6: false                           # 关闭 IPv6 减少解析开销，如果宽带是双栈环境按需开启
mode: rule
log-level: warning
tcp-concurrent: true
find-process-mode: off
global-client-fingerprint: chrome
keep-alive-interval: 30               # 新增：保持连接活跃，减少节点频繁握手的延迟抖动

# [数据库]
geodata-mode: true
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
  asn: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

# [DNS设置]
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  respect-rules: true                 # 新增：DNS 请求本身也遵循分流规则，配合下面两项彻底避免死循环/泄漏
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  default-nameserver:                 # 用于解析下面 nameserver / proxy-server-nameserver 本身的域名，必须填纯 IP
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:            # 新增：专门用于解析代理节点服务器域名，走本地/国内 DNS，避免"先连代理才能解析节点地址"的死锁
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:                  # 新增：规则命中 DIRECT 时使用的 DNS，走国内解析拿到最优 CDN 节点
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    - 'geosite:private'               # 新增：内网域名整体排除
    - 'geosite:category-ntp'          # 新增：NTP 时间同步域名不走 fake-ip，避免系统时间同步异常

# [TUN设置]
tun:
  enable: true
  stack: system                       # system 稳定性和内存表现均衡，mixed/gvisor 仅在 system 兼容性差时再考虑
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true                  # 新增：防止部分场景下流量绕过 TUN 网卡直连，提升分流一致性

# [缓存设置]
profile:
  store-selected: true
  store-fake-ip: false

# [嗅探设置]
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:                        # 新增：这些域名嗅探经常误判导致连接异常，直接跳过嗅探走原始规则匹配
    - "+.push.apple.com"
    - "+.apple-dns.net"

# [代理订阅]
proxy-providers:
  subscribe:
    type: http
    url: " 🧸 请填入你的订阅地址"                   # 🧸 请填入你的订阅地址
    path: ./Server/subscribe.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 3600
      timeout: 5000
      lazy: true

