  TikTok:    { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml,        path: ./ruleset/TikTok.yaml }
  Twitter:   { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml,      path: ./ruleset/Twitter.yaml }
  Facebook:  { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Facebook/Facebook.yaml,    path: ./ruleset/Facebook.yaml }
  Instagram: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.yaml,  path: ./ruleset/Instagram.yaml }
  OpenAI:    { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml,        path: ./ruleset/OpenAI.yaml }
  GitHub:    { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml,        path: ./ruleset/GitHub.yaml }
  Spotify:   { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml,      path: ./ruleset/Spotify.yaml }
  Netflix:   { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml,      path: ./ruleset/Netflix.yaml }
  YouTube:   { <<: *rule-set-classical, url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml,      path: ./ruleset/YouTube.yaml }
