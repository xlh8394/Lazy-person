🇭🇰 Hong Kong = url-test, include-all-proxies, policy-regex-filter=(?i)(香港|港|\bHK\b|Hong.?Kong), url=http://www.gstatic.com/generate_204, interval=900, timeout=5, tolerance=50
🇹🇼 Taiwan = url-test, include-all-proxies, policy-regex-filter=(?i)(台湾|台灣|台北|\bTW\b|Taiwan|Taipei), url=http://www.gstatic.com/generate_204, interval=900, timeout=5, tolerance=50
🇯🇵 Japan = url-test, include-all-proxies, policy-regex-filter=(?i)(日本|东京|東京|大阪|\bJP\b|Japan|Tokyo|Osaka), url=http://www.gstatic.com/generate_204, interval=900, timeout=5, tolerance=50
🇰🇷 Korea = url-test, include-all-proxies, policy-regex-filter=(?i)(韩国|韓國|首尔|首爾|\bKR\b|Korea), url=http://www.gstatic.com/generate_204, interval=900, timeout=5, tolerance=50
🇸🇬 Singapore = url-test, include-all-proxies, policy-regex-filter=(?i)(新加坡|狮城|獅城|\bSG\b|Singapore), url=http://www.gstatic.com/generate_204, interval=900, timeout=5, tolerance=50
🇺🇸 United States = url-test, include-all-proxies, policy-regex-filter=(?i)(美国|美國|\bUS\b|USA|United.?States|America), url=http://www.gstatic.com/generate_204, interval=900, timeout=5, tolerance=50

