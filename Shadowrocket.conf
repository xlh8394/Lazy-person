GEOIP,CN,DIRECT,no-resolve

# 最终兜底
FINAL,PROXY

# =====================================
# Host
# =====================================
[Host]
*.apple.com = server:system
*.icloud.com = server:system
localhost = 127.0.0.1

# =====================================
# URL Rewrite
# =====================================
[URL Rewrite]
# Google 中国域名强制跳转国际版
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

# =====================================
# Script
# =====================================
[Script]

# =====================================
# MITM
# =====================================
[MITM]
h2 = true
enable = true
ca-passphrase = 
ca-p12 = 
hostname = *.google.cn,x.com
