[server_local]
# 本地节点配置区（可选）


[server_remote]
# 示例节点订阅：
# https://你的订阅链接, tag=机场名, update-interval=172800, opt-parser=true, enabled=true


[dns]

# 禁用系统 DNS
no-system

# 禁用 IPv6 DNS（如需开启 IPv6，删除下方 no-ipv6，并在「VPN」栏开启「兼容性增强」）
no-ipv6

# 优先使用 DoH3
prefer-doh3

# 全局加密 DNS（单行多个并发查询）
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://doh.360.cn/dns-query

# -----------------------------------------------------------
# 1.9.0 特性：相同域名匹配的加密 DNS 自动堆叠并并发查询
# 若同时指定了加密 DNS（DoH/DoQ），未加密的明文 DNS 将自动被忽略
# -----------------------------------------------------------

# iCloud 专属并发解析
doh-server = /*.icloud.com/https://dns.alidns.com/dns-query
doh-server = /*.icloud.com/https://doh.pub/dns-query
doq-server = /*.icloud.com/quic://dns.adguard.com

# iCloud 中国
doh-server = /*.icloud.com.cn/https://dns.alidns.com/dns-query
doh-server = /*.icloud.com.cn/https://doh.pub/dns-query

# 腾讯系域名并发解析
doh-server = /*.tencent.com/https://dns.alidns.com/dns-query
doh-server = /*.tencent.com/https://doh.pub/dns-query
doh-server = /*.qq.com/https://dns.alidns.com/dns-query
doh-server = /*.qq.com/https://doh.pub/dns-query

# 微信专属并发解析
doh-server = /*.weixin.com/https://dns.alidns.com/dns-query
doh-server = /*.weixin.com/https://doh.pub/dns-query

# 阿里巴巴 / 淘宝 / 支付宝并发解析
doh-server = /*.alipay.com/https://dns.alidns.com/dns-query
doh-server = /*.alipay.com/https://doh.pub/dns-query
doh-server = /*.taobao.com/https://dns.alidns.com/dns-query
doh-server = /*.taobao.com/https://doh.pub/dns-query
doh-server = /*.tmall.com/https://dns.alidns.com/dns-query
doh-server = /*.tmall.com/https://doh.pub/dns-query


