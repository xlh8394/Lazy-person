# 流媒体解锁查询
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=StreamingCheck, img-url=arrowtriangle.right.square.system, enabled=true

# 节点纯净度查询
