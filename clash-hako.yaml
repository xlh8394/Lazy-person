# 配置名称: Clash 配置（Hako / Apple 平台优化版 · 分流规则源已替换为 MetaCubeX/meta-rules-dat）
# 原作者: Claude 二次优化 → 基于 Hako 配置参考进一步精简
# 更新时间: 2026-08-22
#
# 本次改动：
# 1. rule-providers 全部改为引用 https://github.com/MetaCubeX/meta-rules-dat (meta 分支, .mrs 格式)，
#    不再依赖 blackmatrix7/ios_rule_script。
# 2. geosite 分类沿用 v2fly/domain-list-community 命名体系（meta-rules-dat 的上游数据源）。
# 3. Unbreak / Emby 两个规则集是自定义域名清单，meta-rules-dat 中没有对应分类，予以保留原样（未替换）。
# 4. CN-Media / Global-Media 在 meta-rules-dat 中没有和 ios_rule_script 完全一一对应的聚合分类，
#    这里用较接近的 geosite 分类做了近似替代，建议部署前自行核对效果，必要时再补充自定义规则。
#
# 优化要点（对齐 https://clash.md/zh/guide/config/）：
# 1. 移除 port / socks-port / redir-port / mixed-port / tproxy-port / external-controller / allow-lan 等高级功能字段
# 2. 移除 global-client-fingerprint（不适用 Apple）
# 3. geo 相关字段简化，由 Hako 管理资源与更新
# 4. DNS 保留 respect-rules / proxy-server-nameserver / direct-nameserver 等优秀设计
# 5. TUN / 嗅探精简，Hako 在 Packet Tunnel 中自行管理
# 6. 保持配置简单、结构清晰，只保留实际需要的内容

# [通用设置]（推荐保留）
mode: rule
log-level: warning
ipv6: false                       # 如宽带双栈可改为 true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30           # 保持连接活跃，减少握手抖动

# find-process-mode 在 iOS/tvOS 不支持，macOS 可用；保持 off 即可
# find-process-mode: off

# [数据库]（Hako 管理，精简）
geodata-mode: true
# geo-auto-update / geox-url 由 Hako 管理，手动指定可能被覆盖或无效
# 如需自定义可取消注释，改用 meta-rules-dat 的资源：
# geo-auto-update: true
# geodata-loader: memconservative
# geox-url:
#   geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb"
#   geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
#   mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
#   asn: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

# [DNS设置]（保留原优秀设计，适配 Hako）
dns:
  enable: true                    # Hako 可能管理/强制
  ipv6: false
  prefer-h3: false
  respect-rules: true             # DNS 请求本身也遵循分流规则，避免死循环/泄漏
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  default-nameserver:             # 解析 nameserver 本身用，必须纯 IP
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:        # 解析代理节点域名，走本地/国内 DNS，避免死锁
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:              # DIRECT 规则用国内 DNS，拿最优 CDN
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    - 'geosite:private'
    - 'geosite:category-ntp'

# [缓存设置]
profile:
  store-selected: true
  store-fake-ip: false            # Hako/tvOS 可能清理缓存，按需 true

# [嗅探设置]（精简，保留必要）
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"
    - "+.apple-dns.net"

# [代理订阅]
proxy-providers:
  subscribe:
    type: http
    url: "https:/Your subscription"          # 请替换为真实订阅
    path: ./Server/subscribe.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 3600
      timeout: 5000
      lazy: true

