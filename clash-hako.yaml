# 配置名称: Clash 配置（Hako / Apple 平台优化版）
# 原作者: Claude 二次优化 → 基于 Hako 配置参考进一步精简
# 更新时间: 2026-08-23

# [通用设置]（推荐保留）
mode: rule
log-level: warning
ipv6: false                       # 如宽带双栈可改为 true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30           # 保持连接活跃，减少握手抖动

# find-process-mode 在 iOS/tvOS 不支持，macOS 可用；保持 off 即可
# find-process-mode: off

# [数据库]（Hako 管理，精简）
geodata-mode: true
# geo-auto-update / geox-url 由 Hako 管理，手动指定可能被覆盖或无效
# 如需自定义可取消注释，但建议让客户端处理
# geo-auto-update: true
# geodata-loader: memconservative
# geox-url:
#   geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb"
#   geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
#   mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
#   asn: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

# [DNS设置]（保留原优秀设计，适配 Hako）
dns:
  enable: true                    # Hako 可能管理/强制
  ipv6: false
  prefer-h3: false
  respect-rules: true             # DNS 请求本身也遵循分流规则，避免死循环/泄漏
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  default-nameserver:             # 解析 nameserver 本身用，必须纯 IP
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:        # 解析代理节点域名，走本地/国内 DNS，避免死锁
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:              # DIRECT 规则用国内 DNS，拿最优 CDN
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    - 'geosite:private'
    - 'geosite:category-ntp'

# [缓存设置]
profile:
  store-selected: true
  store-fake-ip: false            # Hako/tvOS 可能清理缓存，按需 true

# [嗅探设置]（精简，保留必要）
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"
    - "+.apple-dns.net"

# [代理订阅]
proxy-providers:
  subscribe:
    type: http
    url: "https://Your.subscription"          # 请替换为真实订阅
    path: ./Server/subscribe.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 3600
      timeout: 5000
      lazy: true

# [公共变量]（下方所有 include-all 组统一使用同一份 exclude-filter，
#  用于剔除订阅方注入的"剩余流量/到期时间/官网地址"等信息展示类伪节点，
