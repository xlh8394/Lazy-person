# [本地规则]（RULE-SET 引用改为 meta-rules-dat 提供的分类）
rules:
  - DOMAIN-SUFFIX,gwdang.com,DIRECT
  - DOMAIN-SUFFIX,cloudflare.com,Global-Media
  - DOMAIN-SUFFIX,freedom.gov,Global-Media
  - RULE-SET,Unbreak,DIRECT
  - RULE-SET,AdBlock,REJECT
  - RULE-SET,AI,AI
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Emby,Emby
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Steam,Gaming
  - RULE-SET,bilibili,bilibili
  - RULE-SET,CN-Media,CN-Media
  - RULE-SET,Global-Media,Global-Media
  - RULE-SET,Global,Global
  - RULE-SET,Apple,Apple
  - GEOSITE,private,DIRECT
  - RULE-SET,ChinaDirect,DIRECT
  - MATCH,Final

# [远程规则]（除 Unbreak / Emby 无对应分类保留原源外，其余均改为 MetaCubeX/meta-rules-dat）
rule-providers:
  # 无 meta-rules-dat 对应分类，保留原自定义规则源
  Unbreak:
    behavior: classical
    interval: 86400
    type: http
    path: ./Ruleset/Unbreak.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/Unbreak.yaml

  Emby:
    behavior: domain
    interval: 86400
    type: http
    format: mrs
    path: ./Ruleset/meta/Emby.mrs"
    url: "https://fastly.jsdelivr.net/gh/666OS/rules@release/mihomo/domain/Emby.mrs"

  # 以下改为 meta-rules-dat (meta 分支, .mrs 格式)
  AdBlock:
    behavior: domain
    interval: 86400
    type: http
    format: mrs
    path: ./Ruleset/meta/category-ads-all.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"

  AI:
