# 配置名称: Clash 配置（Mihomo 内核优化版 · 适配 Hako / Sparkle 客户端）
# 配置作者: 原配置 + Grok 参考优化
# 更新时间: 2026-08-22
#
# 本次优化要点（详见对应位置注释）：
# 1. 所有 Hako 不支持/受管理字段已移除或注释（参考字段支持状态）
# 2. DNS 全面对齐参考：新增 respect-rules / proxy-server-nameserver / direct-nameserver，防死锁/泄漏
# 3. Geo 数据保持你原有的方案 + 最佳实践模板推荐（Hako 平台自动管理）
# 4. sniffer.skip-domain 补充 Apple 常见误判
# 5. 端口/TUN/Sniffer 可由 Sparkle GUI 覆写，裸核运行时仍保留你原有的设置
#

# [端口设置]
# Sparkle GUI 开启接管后会自动覆写，裸核运行时可保留
# Hako Apple Packet Tunnel 不支持 redir-port / tproxy-port / routing-mark / interface-name
port: 7890
socks-port: 7891
# redir-port: 7892          # 不支持，已移除
# tproxy-port: 7894         # 不支持，已移除
mixed-port: 7893

# [通用设置]
external-controller: 0.0.0.0:9090
# geodata-loader: memconservative    # Hako Apple 平台为受管理字段，会自动覆盖（推荐用最佳实践）
# geodata-mode: true                 # 同上，受管理字段
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
  asn: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

unified-delay: true
allow-lan: true
ipv6: false
mode: rule
log-level: warning
tcp-concurrent: true
# find-process-mode: off              # Hako Apple 不支持，已移除
global-client-fingerprint: chrome
keep-alive-interval: 30

# [数据库]
geodata-mode: true                  # Hako 受管理字段，保持原值
geo-auto-update: true
geo-update-interval: 72
geox-url: { ... }                   # 同上

# [DNS设置]
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  respect-rules: true                # 新增：DNS 请求也遵循分流规则，防死锁/泄漏
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  use-system-hosts: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:           # 新增：专用国内 DNS，防节点自身域名解析死锁
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:                 # 新增：DIRECT 时用国内 DNS 拿最优 CDN
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    - 'geosite:private'
    - 'geosite:category-ntp'

# [TUN设置]
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true                 # 新增：提升分流一致性

# [缓存设置]
profile:
  store-selected: true
  store-fake-ip: false

# [嗅探设置]
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:                       # 新增：防 Apple 常见误判
    - "+.push.apple.com"
    - "+.apple-dns.net"

# [代理订阅]
proxy-providers:
  subscribe:
    type: http
    url: " https://Please enter your subscription address"
    path: ./Server/subscribe.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 3600
      timeout: 5000
      lazy: true

