# [本地规则]
rules:
  - DOMAIN-SUFFIX,gwdang.com,DIRECT
  - DOMAIN-SUFFIX,cloudflare.com,Global-Media
  - DOMAIN-SUFFIX,freedom.gov,Global-Media
  - RULE-SET,Unbreak,DIRECT
  - RULE-SET,AdBlock,REJECT
  - RULE-SET,AI,AI
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Emby,Emby
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Steam,Gaming
  - RULE-SET,bilibili,bilibili
  - RULE-SET,CN-Media,CN-Media
  - RULE-SET,Global-Media,Global-Media
  - RULE-SET,Global,Global
  - RULE-SET,Apple,Apple
  - RULE-SET,LAN,DIRECT
  - RULE-SET,ChinaDirect,DIRECT
  - MATCH,Final

# [远程规则]
rule-providers:
  Unbreak:
    behavior: classical
    interval: 86400
    type: http
    path: ./Ruleset/Unbreak.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/Unbreak.yaml
  AdBlock:
    behavior: classical
    interval: 86400
    type: http
    path: ./Ruleset/AdBlock.yaml
